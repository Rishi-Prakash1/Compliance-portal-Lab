# Virtual Evidence Repository - read-only browsable index of the evidence volume.
server {
    listen 80;
    root /srv/evidence;        # not /usr/share/nginx/html: Docker would copy nginx's default page into the volume
    charset utf-8;
    index __no_index__;        # always show the directory listing, never an index page
    default_type text/plain;   # .rules .conf .log .md .yaml open as text (json/html keep their normal types)
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
